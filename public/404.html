<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>plugKe</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // Redirects any 404 to index.html with the path preserved in query string
        var segmentCount = 1; // Adjust based on repository name depth (1 for /my-marketplace2/)
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
            (l.search ? '&q=' + l.search.slice(1) : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
